[versions]
agp = "9.0.1"
kotlin = "2.3.10"
hilt = "2.59.2"

core-ktx = "1.18.0"
appcompat = "1.7.1"
material = "1.13.0"
lifecycle = "2.10.0"
browser = "1.9.0"
